<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4ef">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Учебные материалы по патологии, микробиологии и внутренним болезням. Тренировка, экзамен и работа над ошибками по патологии.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192">
  <title>Pathology Trainer — учебные материалы</title>
  <link rel="stylesheet" href="css/catalog.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="brand" type="button" data-view="catalog" aria-label="Открыть каталог предметов">
        <span class="brand-mark">PT</span>
        <span><span class="brand-name">Pathology Trainer</span><span class="brand-sub">Учебная платформа</span></span>
      </button>
      <div class="search-wrap">
        <input id="site-search" class="site-search" type="search" placeholder="Найти предмет или тему" aria-label="Поиск по предметам и темам" autocomplete="off">
        <div id="search-results" class="search-results" hidden></div>
      </div>
      <div class="topbar-note">Материалы для подготовки</div>
    </header>
    <aside class="sidebar" aria-label="Основная навигация">
      <div class="side-title">Навигация</div>
      <nav class="side-nav" aria-label="Разделы">
        <button class="side-item" type="button" data-view="catalog">Каталог</button>
      </nav>
      <div class="side-divider"></div>
      <div class="side-title">Предметы</div>
      <nav class="side-nav" aria-label="Предметы">
        <button class="side-item" type="button" data-view="pathology">Патология<small>Контрольные работы</small></button>
        <button class="side-item" type="button" data-view="micro">Микробиология<small>C. diphtheriae</small></button>
        <button class="side-item" type="button" data-view="internal">Внутренние болезни<small>Материалы готовятся</small></button>
      </nav>
      <div class="sidebar-note">Структура рассчитана на новые предметы, темы и отдельные банки РК.</div>
    </aside>
    <main class="main" id="main"><div class="main-inner" id="main-inner"></div></main>
    <aside class="rail" aria-label="Оглавление и справка"><div class="rail-inner" id="rail-inner"></div></aside>
  </div>
  <script src="js/catalog.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
